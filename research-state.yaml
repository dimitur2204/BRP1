# Research State — Central Project Tracking (autoresearch)

project:
  title: "Immune vs vascular aging on lung-screening CT: thymic health, cardiac calcium and lung-cancer risk in NLST"
  question: >
    Do CT-derived markers of two aging axes (immune: published thymic-health
    score, Bernatz et al. Nature 2026; vascular/cardiac: our heart calcium and
    pericardial-fat features) carry independent, additive information about
    lung-cancer incidence beyond age, sex and smoking status, or are they
    proxies of the same unmeasured smoking burden?
  status: active
  started: "2026-09-27"
  domain: "opportunistic CT imaging biomarkers / survival analysis"
  branch: thymus-heart-aging          # built on heart-radiomics (a5c0fc8)

prior_work:
  heart_radiomics_R0_R5: >
    6,205 QC-passed NLST baseline LDCTs (train 2147/710 ev, val 2018/154,
    test 2040/154). Cardiac calcium proxy replicated (test HR/SD 1.32,
    p=0.0006) beyond age/sex/smoking. Test C: clinical 0.647, clinical+calcium
    0.658 (dC +0.011, p=0.08), Cox-EN heart+clinical 0.662 (dC +0.014, p=0.03).
    DeepSurv/RSF did not beat linear Cox. See PROGRESS.md.

literature:
  key_papers:
    - id: bernatz2026thymic
      title: "Thymic health consequences in adults"
      venue: "Nature 652, 986-994 (2026)"
      relevance: "Source of the NLST thymic-health score; lung-cancer incidence HR 0.64 high vs low (6-yr)"
    - id: bernatz2026ici
      title: "Thymic health and immunotherapy outcomes in patients with cancer"
      venue: "Nature 652, 995-1003 (2026)"
      relevance: "Same score; prognostic for ICI outcomes; independent of PD-L1/TMB"
  survey: "literature/survey.md"      # written by background lit agent
  open_problems:
    - "No study has combined thymic health with cardiac calcium on the same scans"
    - "Whether the TH-lung-cancer association survives adjustment for emphysema / cardiac markers is unknown"
  evidence_gaps:
    - "IDC-780 lacks pack-years; emphysema read (ctab 59) is the best available smoking-burden proxy"

hypotheses:
  - id: H1
    statement: "Published thymic health (TH) is inversely associated with lung-cancer incidence in our cohort beyond age/sex/smoking (high vs low HR in [0.5, 0.85], p<0.05)"
    status: revised   # case-cohort E1: 0.95 n.s.; full CT arm (E5): adj 0.91/SD p=0.004, high vs low 0.81 -> association real but histology-specific
    priority: high
    parent: null
  - id: H2
    statement: "Lower TH is associated with more cardiac calcium and more pericardial fat, adjusted for age/sex/smoking (partial rho(TH, calcium) in [-0.15,-0.02]; rho(TH, fat) negative, |rho|>0.1)"
    status: supported # partial rho TH-calcium -0.10, TH-fat -0.32 (E1)
    priority: high
    parent: null
  - id: H3
    statement: "TH and calcium are independent: in a joint Cox both stay p<0.05 and each log-HR attenuates <15% vs single-marker models"
    status: refuted   # calcium independent of TH (3% atten) but TH n.s. (E1)
    priority: high
    parent: null
  - id: H4
    statement: "Clinical+TH+calcium beats clinical on held-out test (dC CI excludes 0) and beats clinical+calcium (point estimate)"
    status: refuted   # dC +0.008 [-0.004,0.020]; TH adds -0.002 over clin+Ca (E1)
    priority: high
    parent: null
  - id: H5
    statement: "Smoking-burden proxy test: adjusting for radiologist-read emphysema attenuates the calcium log-HR >=25% (proxy) vs <10% (independent)"
    status: supported # "independent": calcium atten by emphysema 1.5% [-6,10]% (E2)
    priority: medium
    parent: null
  - id: H6
    statement: "Validity: calcium proxy discriminates radiologist 'significant CV abnormality' (ctab 60, yr0) with AUC >= 0.75; TH is inversely associated with ctab 60"
    status: partial   # calcium AUC ctab60 0.62 (<0.75) but OR 1.40; TH OR 0.85 (E2)
    priority: medium
    parent: null

  - id: H7
    statement: "Histology specificity (indirect pack-years test): if calcium proxies smoking dose, its HR is >=10% larger for squamous+small-cell than adenocarcinoma (positive control: current smoking)"
    status: inconclusive # calcium ratio SQ/SC/adeno 1.08 [0.94,1.25]; smoking control 1.74 (E3)
    priority: high
    parent: H5
  - id: H8
    statement: "Calcium is a long-term risk marker: landmark (>1 yr) HR >= 1.10, CI excludes 1"
    status: supported # landmark >1yr HR 1.14; T0 vs later ratio 1.00 (E3)
    priority: medium
    parent: null
  - id: H9
    statement: "Monotone dose-response over zero / nonzero-tertile calcium; T3 vs zero HR > 1.3; trend p < 0.01"
    status: supported # T3 vs zero 1.36, trend p=0.0013, threshold-like (E3)
    priority: medium
    parent: null
  - id: H10
    statement: "Calcium HR >= 1.10 (p<0.01) under flexible age (strata / spline) and scanner adjustment; >1 in both smoking strata"
    status: supported # age strata/spline/scanner 1.14-1.17; former 1.08 (n.s.) (E3)
    priority: medium
    parent: null
  - id: H11
    statement: "TH is scanner-robust: kernel leakage AUC < 0.60, scanner partial R2 < 2%, TH HR change < 0.02 with batch adjustment"
    status: supported # TH kernel AUC 0.52, partial R2 1.8%, dHR -0.003 (E3)
    priority: medium
    parent: null

  - id: H12
    statement: "TH x histology heterogeneity (SQ/SC protective, adeno null) is robust to dose-marker adjustment (SQ/SC HR <=0.90, p<0.05, ratio <=0.87), consistent across splits/subgroups, and not shared by fat/heart-volume comparators"
    status: mostly-supported # LM interaction 0.82 p=0.010; 7/7 subsets; 25% atten by dose markers (calcium); test SQ/SC dC +0.013 (E4)
    priority: high
    parent: H1

  - id: H13
    statement: "Our TH pipeline reproduces the paper on the full NLST CT arm: unadjusted 6-yr high vs low HR within [0.53, 0.76]"
    status: supported # 6-yr unadj high vs low 0.649 [0.54,0.78] vs paper 0.64 [0.53,0.76] (E5)
    priority: medium
    parent: H1
  - id: H14
    statement: "TH x histology heterogeneity holds in the full (unsampled) CT arm: LM interaction < 1, p<0.05; SQ/SC HR/SD < 0.92; adeno CI includes 1"
    status: supported # full CT arm LM interaction 0.835 p=0.019; SQ/SC 0.83, adeno 1.00 (E5)
    priority: high
    parent: H12

experiments:
  proxy_metric: "Held-out test Harrell's C (n=2,040-ish, ~150 events) of Cox models fit on train+val; primary association metric = adjusted HR per SD on the full cohort (stratified by split)"
  baseline_value: 0.657          # clinical Cox on TH-complete test (R5 full test: 0.647)
  best_value: 0.688              # clinical + emphysema + calcium (E2)
  total_runs: 8
  trajectory:   # test Harrell C, TH-complete test split n=1,983 / 149 events
    - {run_id: E1-clin, hypothesis: H4, metric_value: 0.657, delta: 0.000, change_summary: "clinical Cox (age, sex, smoking)"}
    - {run_id: E1-TH, hypothesis: H4, metric_value: 0.658, delta: 0.001, change_summary: "+ thymic health"}
    - {run_id: E1-Ca, hypothesis: H4, metric_value: 0.667, delta: 0.010, change_summary: "+ cardiac calcium"}
    - {run_id: E1-TH-Ca, hypothesis: H4, metric_value: 0.665, delta: 0.008, change_summary: "+ TH + calcium"}
    - {run_id: E2-emph, hypothesis: H5, metric_value: 0.678, delta: 0.021, change_summary: "+ radiologist emphysema read"}
    - {run_id: E2-emph-Ca, hypothesis: H5, metric_value: 0.688, delta: 0.031, change_summary: "+ emphysema + calcium"}
    - {run_id: E2-emph-TH-Ca, hypothesis: H5, metric_value: 0.685, delta: 0.028, change_summary: "+ emphysema + TH + calcium"}

outer_loop:
  cycle: 3
  last_direction: deepen
  last_reflection: >
    Calcium is robust, independent of TH and emphysema, +0.01 C on every base.
    TH-LC association is mostly age; TH is linked to cardiac fat/calcium/CV flags.
    Next (E3): calcium mechanism -- histology specificity (indirect pack-years
    test), time-varying HR (reverse causation), dose-response categories,
    flexible age; TH kernel robustness.

